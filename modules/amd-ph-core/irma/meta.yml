---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "irma"
description: |
  Run IRMA, the Iterative Refinement Meta-Assembler, for assembly, variant calling, and phasing of
  highly variable RNA viruses.
  IRMA selects its behaviour from a named module (FLU, EBOLA, RSV, CoV, and their platform variants),
  which is a mandatory positional argument to the tool. It is taken here as a value input rather than
  read from a pipeline parameter, so the module does not depend on what the calling pipeline happens to
  name its params. Pipelines are expected to supply it from a Nextflow profile.
keywords:
  - assembly
  - variant-calling
  - phasing
  - rna-virus
  - influenza
tools:
  - "irma":
      description: "IRMA: Iterative Refinement Meta-Assembler for the robust assembly, variant calling, and phasing of highly variable RNA viruses."
      homepage: "https://wonder.cdc.gov/amd/flu/irma/"
      documentation: "https://wonder.cdc.gov/amd/flu/irma/"
      licence: ["GPL v3 or later (GPL v3+)"]
      args_id: "$args"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - reads:
        type: file
        description: Input reads, single-end or paired-end
        pattern: "*.{fastq,fq,fastq.gz,fq.gz}"
  - irma_module:
      type: string
      description: |
        IRMA module name, a mandatory positional argument selecting the assay and platform behaviour
        (e.g. FLU, FLU-minion, EBOLA, RSV, CoV). (Mandatory)

output:
  - results:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*":
          type: directory
          description: IRMA output directory for the sample
          pattern: "*"
  - amended_consensus:
      - "amended_consensus/*.fa":
          type: file
          description: Per-segment amended consensus sequences (Optional)
          pattern: "amended_consensus/*.fa"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@smagala"
maintainers:
  - "@smagala"
