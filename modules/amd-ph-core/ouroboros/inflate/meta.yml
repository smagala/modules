---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "ouroboros_inflate"
description: |
  Expand deflated read patterns back into real reads.
  Preprocessing collapses identical reads into patterns plus a deflation index, and everything upstream
  of assembly operates in pattern space. This module reverses that so downstream alignment and depth
  reporting see TRUE per-read depth. The distinction is not cosmetic: pattern counts understate depth,
  so any depth taken from the pattern-space side of the pipeline is wrong rather than approximate.
keywords:
  - deflate
  - inflate
  - reads
  - depth
  - fastq
tools:
  - "irma-core":
      description: "Rust reimplementation of IRMA's core routines; the xflate subcommand expands deflated read patterns using the deflation index."
      homepage: "https://github.com/CDCgov/irma-core"
      documentation: "https://github.com/CDCgov/irma-core"
      licence: ["Apache-2.0"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - gene:
        type: string
        description: Target/bin label, which is also the panel reference record ID
    - reads:
        type: file
        description: Deflated read patterns for this gene
        pattern: "*.{fa,fasta}"
    - deflation_index:
        type: file
        description: Deflation index written by preprocessing, mapping patterns back to reads
        pattern: "*.xfl"

output:
  - fastq:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - gene:
          type: string
          description: Target/bin label
      - "*.fastq":
          type: file
          description: Inflated reads at true per-read depth
          pattern: "*.fastq"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@smagala"
maintainers:
  - "@smagala"
