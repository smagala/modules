---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "ouroboros_recruit"
description: |
  Run one whole recruit round — MATCH, SORT, per-gene ALIGN and REFINE, then the convergence close — in
  a single process, driven by a topic feedback loop.
  The process reads a bundled state directory, runs the round, writes the next state directory, and
  re-emits it to the SAME 'gather' topic it reads from, so it feeds itself. OUROBOROS_SEED (in this same
  module, since it produces the state format this process consumes) puts the first state on the topic;
  the calling subworkflow's `until` gate drops the converged item to stop the loop.
  The round is one process rather than five on purpose. An earlier decomposition into discrete
  MATCH/SORT/ALIGN/REFINE processes was clean on paper and lost badly on the cloud, because the round's
  own compute is seconds and per-step task overhead dominated it.
  Settings arrive as a single Map. Twenty-one positional value inputs would mis-bind silently on any
  reorder, so the keys are validated in the script block and a missing one fails with its name rather
  than interpolating "null" into a shell command.
keywords:
  - recruitment
  - iterative-refinement
  - reference-refinement
  - chimera
  - meta-assembly
tools:
  - "rammap":
      description: "Pure-Rust minimap2-compatible read mapper; used for both the MATCH and the per-gene ALIGN steps, with native --filter-chimera."
      homepage: "https://github.com/jwanglab/rammap"
      documentation: "https://github.com/jwanglab/rammap"
      licence: ["MIT"]
  - "blast":
      description: "NCBI BLAST+; the alternative MATCH and ALIGN path, selected by match_aligner or gather_aligner."
      homepage: "https://blast.ncbi.nlm.nih.gov/"
      documentation: "https://www.ncbi.nlm.nih.gov/books/NBK279690/"
      licence: ["Public Domain"]
  - "samtools":
      description: "Filters unmapped records out of the rammap ALIGN stream before the stats step."
      homepage: "https://www.htslib.org/"
      documentation: "https://www.htslib.org/doc/samtools.html"
      licence: ["MIT"]
  - "parse_sort_results.py":
      description: "Bins matched reads per target and applies the recruitment floors, including the secondary-population keep. Ships in this module's resources/usr/bin."
      homepage: "https://github.com/cdcent/oamd-bio-ouroboros"
      documentation: "https://github.com/cdcent/oamd-bio-ouroboros"
      licence: ["MIT"]
  - "combine_align_stats.py":
      description: "Builds the next per-gene reference from the CUMULATIVE alignment JSONs across all rounds. Cumulative is required, not an optimisation: a reference built from one round's JSON collapses on a round that recruits few reads. Ships in this module's resources/usr/bin."
      homepage: "https://github.com/cdcent/oamd-bio-ouroboros"
      documentation: "https://github.com/cdcent/oamd-bio-ouroboros"
      licence: ["MIT"]
  - "sam_align_stats.py":
      description: "Converts the rammap ALIGN SAM into per-position alignment statistics. Ships in this module's resources/usr/bin."
      homepage: "https://github.com/cdcent/oamd-bio-ouroboros"
      documentation: "https://github.com/cdcent/oamd-bio-ouroboros"
      licence: ["MIT"]
  - "blast_align_stats.py":
      description: "Converts BLAST tabular alignment output into per-position alignment statistics. Ships in this module's resources/usr/bin."
      homepage: "https://github.com/cdcent/oamd-bio-ouroboros"
      documentation: "https://github.com/cdcent/oamd-bio-ouroboros"
      licence: ["MIT"]
  - "blast_match.py":
      description: "Partitions reads into match/class/nomatch/chimeric sets from BLAST hits. Ships in this module's resources/usr/bin."
      homepage: "https://github.com/cdcent/oamd-bio-ouroboros"
      documentation: "https://github.com/cdcent/oamd-bio-ouroboros"
      licence: ["MIT"]
  - "rammap_partition.py":
      description: "Partitions reads into match/class/nomatch/chimeric sets from a rammap PAF, using the native ch:i:1 chimera tag. Ships in this module's resources/usr/bin."
      homepage: "https://github.com/cdcent/oamd-bio-ouroboros"
      documentation: "https://github.com/cdcent/oamd-bio-ouroboros"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - instate:
        type: directory
        description: |
          Round input state: refs.fasta (the combined reference matched this round), carry.fa (reads
          still to match), gene_refs/ (prior per-gene refs), jsons/ (CUMULATIVE per-gene alignment JSONs).
        pattern: "instate"
    - round:
        type: integer
        description: Round number, 1-based
    - done:
        type: integer
        description: Convergence flag from the prior round; the `until` gate reads it, this process does not
  - recruit_opts:
      type: map
      description: |
        Recruit settings. Required keys: match_aligner, gather_aligner, blast_task, blast_dust,
        blast_evalue, blast_min_hsp_len, blast_min_hsp_pid, blast_incl_chim, min_recruit_count,
        min_recruit_patterns, sort_groups, ban_groups, secondary_min_depth, secondary_min_frac, min_ca,
        min_fa, skip_elongation, gather_position_bias, gather_del_type, min_column_coverage,
        gather_ref_floor. Validated in the script block. (Mandatory)

output:
  - gene_refs:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "R*-*.ref":
          type: file
          description: Per-gene refined references from this round (Optional — a barren round emits none)
          pattern: "R*-*.ref"
      - round:
          type: integer
          description: Round number
  - sorted:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "R*-*.fa":
          type: file
          description: Reads binned per gene this round (Optional — a barren round emits none)
          pattern: "R*-*.fa"
      - round:
          type: integer
          description: Round number
  - raw_nomatch:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "R*.nomatch":
          type: file
          description: Reads not recruited this round; the last round's becomes nomatch.fa
          pattern: "R*.nomatch"
      - round:
          type: integer
          description: Round number
  - chimeric:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "R*.chim":
          type: file
          description: Reads dropped as chimeric; round 1's becomes chimeric.fa
          pattern: "R*.chim"
      - round:
          type: integer
          description: Round number
  - stats:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "R*.sort_stats.txt":
          type: file
          description: Per-gene read-pattern and read counts for this round
          pattern: "R*.sort_stats.txt"
      - round:
          type: integer
          description: Round number
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@smagala"
maintainers:
  - "@smagala"
