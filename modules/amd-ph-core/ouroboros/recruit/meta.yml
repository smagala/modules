---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "ouroboros_recruit"
description: |
  Run the entire recruit/refine loop for one sample — MATCH, SORT, per-gene ALIGN and REFINE, and the
  convergence close, repeated until the reference stops moving, nothing is left to recruit, or
  max_rounds is reached — in a single task.
  The loop lives in the task because every in-workflow alternative breaks with more than one item in
  flight: `until` closes the whole channel instead of dropping the matching item, so the first sample to
  converge silently truncates the rest; `filter` deadlocks because the topic never closes; and
  `.recurse()` is value-channel only. Looping here makes per-sample and per-bin independence an ordinary
  Nextflow scatter, with no state written to disk between rounds.
  Round state lives in the task's own working directory: REFS and READS advance each iteration and the
  cumulative per-gene JSONs accumulate in place, so nothing is copied between rounds.
  This task is also the only place that knows the round ORDER, which is why it writes the terminal
  reports itself — a downstream `R*.sort_stats.txt` glob sorts lexically and would place R10 before R2.
  Settings arrive as a single Map. Twenty-one positional value inputs would mis-bind silently on any
  reorder, so the keys are validated in the script block and a missing one fails with its name.
keywords:
  - recruitment
  - iterative-refinement
  - reference-refinement
  - chimera
  - meta-assembly
tools:
  - "rammap":
      description: "Pure-Rust minimap2-compatible read mapper; used for both the MATCH and the per-gene ALIGN steps, with native --filter-chimera."
      homepage: "https://github.com/jwanglab/rammap"
      documentation: "https://github.com/jwanglab/rammap"
      licence: ["MIT"]
  - "blast":
      description: "NCBI BLAST+; the alternative MATCH and ALIGN path, selected by match_aligner or gather_aligner."
      homepage: "https://blast.ncbi.nlm.nih.gov/"
      documentation: "https://www.ncbi.nlm.nih.gov/books/NBK279690/"
      licence: ["Public Domain"]
  - "samtools":
      description: "Filters unmapped records out of the rammap ALIGN stream before the stats step."
      homepage: "https://www.htslib.org/"
      documentation: "https://www.htslib.org/doc/samtools.html"
      licence: ["MIT"]
  - "parse_sort_results.py":
      description: "Bins matched reads per target and applies the recruitment floors, including the secondary-population keep. Ships in this module's resources/usr/bin."
      homepage: "https://github.com/cdcent/oamd-bio-ouroboros"
      documentation: "https://github.com/cdcent/oamd-bio-ouroboros"
      licence: ["MIT"]
  - "combine_align_stats.py":
      description: "Builds the next per-gene reference from the CUMULATIVE alignment JSONs across all rounds. Cumulative is required, not an optimisation: a reference built from one round's JSON collapses on a round that recruits few reads. Ships in this module's resources/usr/bin."
      homepage: "https://github.com/cdcent/oamd-bio-ouroboros"
      documentation: "https://github.com/cdcent/oamd-bio-ouroboros"
      licence: ["MIT"]
  - "sam_align_stats.py":
      description: "Converts the rammap ALIGN SAM into per-position alignment statistics. Ships in this module's resources/usr/bin."
      homepage: "https://github.com/cdcent/oamd-bio-ouroboros"
      documentation: "https://github.com/cdcent/oamd-bio-ouroboros"
      licence: ["MIT"]
  - "blast_align_stats.py":
      description: "Converts BLAST tabular alignment output into per-position alignment statistics. Ships in this module's resources/usr/bin."
      homepage: "https://github.com/cdcent/oamd-bio-ouroboros"
      documentation: "https://github.com/cdcent/oamd-bio-ouroboros"
      licence: ["MIT"]
  - "blast_match.py":
      description: "Partitions reads into match/class/nomatch/chimeric sets from BLAST hits. Ships in this module's resources/usr/bin."
      homepage: "https://github.com/cdcent/oamd-bio-ouroboros"
      documentation: "https://github.com/cdcent/oamd-bio-ouroboros"
      licence: ["MIT"]
  - "rammap_partition.py":
      description: "Partitions reads into match/class/nomatch/chimeric sets from a rammap PAF, using the native ch:i:1 chimera tag. Ships in this module's resources/usr/bin."
      homepage: "https://github.com/cdcent/oamd-bio-ouroboros"
      documentation: "https://github.com/cdcent/oamd-bio-ouroboros"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - reads:
        type: file
        description: Deflated read patterns for the sample; the round-1 query set
        pattern: "*.{fa,fasta}"
    - refs:
        type: file
        description: Panel reference set. Its record IDs are the bin labels and the reporting frame.
        pattern: "*.{fa,fasta}"
  - recruit_opts:
      type: map
      description: |
        Recruit settings. Required keys: match_aligner, gather_aligner, blast_task, blast_dust,
        blast_evalue, blast_min_hsp_len, blast_min_hsp_pid, blast_incl_chim, min_recruit_count,
        min_recruit_patterns, sort_groups, ban_groups, secondary_min_depth, secondary_min_frac, min_ca,
        min_fa, skip_elongation, gather_position_bias, gather_del_type, min_column_coverage,
        gather_ref_floor. Validated in the script block. (Mandatory)
  - max_rounds:
      type: integer
      description: Safety cap on rounds; convergence normally stops the loop first (Mandatory)

output:
  - gene_refs:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "R*-*.ref":
          type: file
          description: Per-gene refined references from every round; the highest round per gene is the one assembly consumes (Optional)
          pattern: "R*-*.ref"
  - sorted:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "R*-*.fa":
          type: file
          description: Reads binned per gene, from every round (Optional)
          pattern: "R*-*.fa"
  - nomatch:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "nomatch.fa":
          type: file
          description: Reads never recruited. Every depth this pipeline reports is RECRUITED depth, so this is what distinguishes "not recruited" from "not sequenced".
          pattern: "nomatch.fa"
  - chimeric:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "chimeric.fa":
          type: file
          description: Round-1 reads dropped as chimeric
          pattern: "chimeric.fa"
  - sort_stats:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "sorted_read_stats.txt":
          type: file
          description: Per-gene read-pattern and read counts, every round, concatenated in round order
          pattern: "sorted_read_stats.txt"
  - timings:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "round_timings.tsv":
          type: file
          description: Per-round seconds, convergence flag, and the reason the loop stopped
          pattern: "round_timings.tsv"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@smagala"
maintainers:
  - "@smagala"
