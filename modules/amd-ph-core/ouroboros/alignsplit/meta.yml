---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "ouroboros_alignsplit"
description: |
  Partition a gene's inflated reads into chunk FASTQs for the alignment scatter-gather.
  At or below chunk_reads the reads stay in a single chunk, so the sample runs as one fat multicore
  ALIGNCHUNK task rather than fanning out; beyond it the reads are split into evenly sized chunks that
  spread across cloud instances. RAMMAP threads internally and is always a single chunk. The emitted
  chunk count lets the downstream gather be bounded, which a Nextflow recursion requires.
keywords:
  - scatter
  - chunk
  - fastq
  - alignment
  - partition
tools:
  - "coreutils":
      description: "GNU coreutils — split/wc/mv partition the FASTQ. No versions.yml is emitted; there is no meaningful tool version to report for a file partition."
      homepage: "https://www.gnu.org/software/coreutils/"
      documentation: "https://www.gnu.org/software/coreutils/manual/"
      licence: ["GPL v3+"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - gene:
        type: string
        description: Target/bin label, which is also the panel reference record ID
    - round:
        type: integer
        description: Assembly round number, carried so downstream joins stay keyed under recursion
    - reads:
        type: file
        description: Inflated reads for this gene and round
        pattern: "*.{fastq,fq}"
    - ref:
        type: file
        description: Reference this round aligns against, passed through to the gather
        pattern: "*.{fa,fasta,ref}"
  - aligner:
      type: string
      description: "Aligner selector: RAMMAP (always one chunk) or LOCALSW (may scatter)"
  - chunk_reads:
      type: integer
      description: Read count per chunk above which the scatter fans out

output:
  - chunks:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - gene:
          type: string
          description: Target/bin label
      - round:
          type: integer
          description: Assembly round number
      - ref:
          type: file
          description: The reference, passed through unchanged
          pattern: "*.{fa,fasta,ref}"
      - "chunk.*.fastq":
          type: file
          description: Read chunks, one ALIGNCHUNK task each
          pattern: "chunk.*.fastq"
  - nchunk:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - gene:
          type: string
          description: Target/bin label
      - round:
          type: integer
          description: Assembly round number
      - NCHUNK:
          type: integer
          description: Number of chunks produced, used to bound the downstream groupKey gather

authors:
  - "@smagala"
maintainers:
  - "@smagala"
