---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "ouroboros_assemble"
description: |
  Iterative assembly polishing followed by terminal variant calling.
  Reads are inflated once, then a polishing round runs as native Nextflow recursion: each round aligns
  every not-yet-converged gene through OUROBOROS_ALIGN and amends its reference from the resulting
  pileup. The loop stops when every gene reaches a byte fixpoint or a score plateau, or when the
  iteration cap is hit. Each gene's HIGHEST-scoring round then feeds variant calling, which handles
  both a plateau and an outright score decrease without threading a "previous best" through the state.
  Requires `nextflow.preview.recursion = true` in the entry script; a nextflow.config setting is
  ignored, and the flag is still required on Nextflow 25.10.4 despite the docs calling it deprecated.
  Settings arrive as Maps rather than roughly twenty-five positional values, because positional
  threading at that arity is unreadable and mis-binds silently when arguments are reordered. Required
  keys are validated on entry so a typo fails loudly here instead of surfacing as a null inside a task
  script. The alignment settings ride inside the recursion state, since .recurse() requires the take
  and emit shapes to match exactly and therefore admits no second `take:`.
keywords:
  - assembly
  - polishing
  - recursion
  - variant-calling
  - consensus
components:
  - ouroboros/inflate
  - ouroboros/call
  - ouroboros/report
  - ouroboros_align

input:
  - ch_in:
      type: file
      description: |
        Per-gene sorted reads, the gather-stage reference, and the deflation index.
        Structure: [ val(meta), val(gene), path(sorted_reads), path(ref), path(deflation_index) ]
      pattern: "*.{fa,fasta}"
  - align_opts:
      type: map
      description: |
        Alignment and reference-refinement settings. Required keys: aligner, chunk_reads, sw_match,
        sw_mismatch, sw_gap_open, sw_gap_extend, term_ext, ins_fold_freq, del_fold_freq,
        mut_min_strand_frac. Validated on entry.
        Structure: val(align_opts)
  - call_opts:
      type: map
      description: |
        Variant-calling and consensus settings. Required keys: min_variant_count, min_variant_freq,
        min_ins_freq, min_del_freq, min_variant_qual, min_column_coverage, min_confidence, sig_level,
        auto_freq, min_ambig_freq, seg_numbers, sort_groups, caller, refchg, sor, amend_indels,
        refchg_min_strand_frac. Validated on entry.
        Structure: val(call_opts)
  - max_iter:
      type: integer
      description: |
        Safety cap on polishing rounds. Convergence normally stops the loop well before this.
        Structure: val(max_iter)

output:
  - consensus:
      type: file
      description: |
        Plurality consensus per gene.
        Structure: [ val(meta), val(gene), path(fasta) ]
      pattern: "*.fasta"
  - variants:
      type: file
      description: |
        Called variants per gene.
        Structure: [ val(meta), val(gene), path(txt) ]
      pattern: "*-variants.txt"
  - alleles:
      type: file
      description: |
        Per-position allele counts for every site.
        Structure: [ val(meta), val(gene), path(txt) ]
      pattern: "*-allAlleles.txt"
  - coverage:
      type: file
      description: |
        Per-position depth at true per-read depth, in the consensus frame.
        Structure: [ val(meta), val(gene), path(txt) ]
      pattern: "*-coverage.txt"
  - bam:
      type: file
      description: |
        Coordinate-sorted alignments against the converged reference.
        Structure: [ val(meta), val(gene), path(bam) ]
      pattern: "*.bam"
  - vcf:
      type: file
      description: |
        VCFv4.2 in the assembled consensus frame, so within-sample variation only.
        Structure: [ val(meta), val(gene), path(vcf) ]
      pattern: "*.vcf"
  - amended:
      type: file
      description: |
        Consensus with called variants applied.
        Structure: [ val(meta), val(gene), path(fa) ]
      pattern: "*.fa"
  - amended_len:
      type: integer
      description: |
        Length of the amended consensus, 0 when absent; the downstream stitch gate needs it as a value.
        Structure: [ val(meta), val(gene), val(length) ]
  - indels_folded:
      type: integer
      description: |
        1 iff an indel was folded into the reference in any round, OR-accumulated across rounds.
        Structure: [ val(meta), val(gene), val(0|1) ]
  - versions:
      type: file
      description: |
        File containing software versions.
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"

authors:
  - "@smagala"
maintainers:
  - "@smagala"
